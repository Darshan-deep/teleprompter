name: teleprompter
description: "Teleprompter — a distraction-free, offline script reader for creators."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_bloc: ^9.1.1
  equatable: ^2.1.0

  # Navigation
  go_router: ^18.0.1

  # Local persistence (offline-first)
  shared_preferences: ^2.5.5

  # Icons
  cupertino_icons: ^1.0.8

  # Google Fonts
  google_fonts: ^7.0.0

  # Camera for video recording
  camera: ^0.10.5+5
  video_player: ^2.8.1

  # Permissions handling
  permission_handler: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-400.ttf
          weight: 400
        - asset: assets/fonts/Outfit-700.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-400.ttf
          weight: 400
        - asset: assets/fonts/Inter-500.ttf
          weight: 500
        - asset: assets/fonts/Inter-600.ttf
          weight: 600
        - asset: assets/fonts/Inter-700.ttf
          weight: 700
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora-400.ttf
          weight: 400
        - asset: assets/fonts/Lora-600.ttf
          weight: 600
    - family: AtkinsonHyperlegible
      fonts:
        - asset: assets/fonts/Atkinson-Regular.ttf
          weight: 400
        - asset: assets/fonts/Atkinson-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-400.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-500.ttf
          weight: 500
